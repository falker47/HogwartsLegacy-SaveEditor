name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run unit tests
        run: pytest -q

  editor-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HLSE-src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: HLSE-src/package-lock.json
      - name: Install dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test editor downloads headlessly
        run: npm test
      - name: Build single-file editor
        run: npm run build

  release-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: HLSE-src/package-lock.json
      - name: Build release package end to end
        shell: cmd
        run: build_release.bat
      - name: Verify complete package and embedded assets
        shell: pwsh
        env:
          QA_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $checkout = (git rev-parse HEAD).Trim()
          if ($checkout -ne $env:QA_HEAD) { throw 'Wrong checkout for QA artifact' }
          python scripts/verify_release.py --release release --commit $checkout
          if ($LASTEXITCODE -ne 0) { throw 'Package validation failed' }

      - name: Upload QA candidate package (never publish)
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/qa-candidate-20261025'
        uses: actions/upload-artifact@v4
        with:
          name: HogwartsLegacy-SaveEditor-PR26-QA
          path: release/
          if-no-files-found: error
          retention-days: 30
