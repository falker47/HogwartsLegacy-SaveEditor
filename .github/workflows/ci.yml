name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run unit tests
        run: pytest -q

  editor-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HLSE-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: HLSE-src/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build single-file editor
        run: npm run build
