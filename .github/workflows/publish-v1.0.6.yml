name: Publish v1.0.6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.0.6.yml"
      - "docs/RELEASE_v1.0.6.md"

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'falker47/HogwartsLegacy-SaveEditor'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: HLSE-src/package-lock.json

      - name: Build release package end to end
        shell: cmd
        run: build_release.bat

      - name: Verify v1.0.6 package
        shell: powershell
        run: |
          $config = Get-Content "src/config.py" -Raw
          if ($config -notmatch 'VERSION = "1\.0\.6"') {
            throw "src/config.py is not version 1.0.6"
          }

          $required = @(
            "release\HogwartsLegacy-SaveEditor.exe",
            "release\assets\HLSGE.html",
            "release\assets\hlsaves.exe",
            "release\THIRD_PARTY_NOTICES.md",
            "release\hlsavetool-LICENSE.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing expected release file: $path" }
          }
          if (Test-Path "release\assets\oo2core_9_win64.dll") {
            throw "Oodle DLL must not be distributed in the release package."
          }

      - name: Create release ZIP
        shell: powershell
        run: |
          $zip = "HogwartsLegacy-SaveEditor-v1.0.6.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "release\*" -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "Release ZIP was not created." }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "RELEASE_ZIP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "SHA256: $hash"

      - name: Preserve verified ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HogwartsLegacy-SaveEditor-v1.0.6
          path: HogwartsLegacy-SaveEditor-v1.0.6.zip
          if-no-files-found: error

      - name: Create draft release if absent
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.6 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.0.6 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "v1.0.6" --notes-file "docs/RELEASE_v1.0.6.md" --draft
            if ($LASTEXITCODE -ne 0) { throw "Failed to create draft release." }
          }

      - name: Upload release ZIP and publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.6 "HogwartsLegacy-SaveEditor-v1.0.6.zip" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload release ZIP." }

          gh release edit v1.0.6 --repo $env:GITHUB_REPOSITORY --title "v1.0.6" --notes-file "docs/RELEASE_v1.0.6.md" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release." }
